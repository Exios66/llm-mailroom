version: 2.1

# Free-tier CircleCI gate for the pipeline repo (same service as
# local-mailroom-sandbox and llm-dojo-scoring). Runs on every push/PR once the
# repo is followed in CircleCI; to BLOCK merges, mark "ci/circleci: test" as a
# required check in the GitHub branch protection rule for main.
#
# Network-free and key-free by design: conftest.py mocks the LLM client, and the
# experiment gate runs with --mock. Install with pip, NOT uv: pyproject's
# [tool.uv.sources] points llm-dojo-scoring at a hub workspace that does not
# exist in this standalone repo.

executors:
  py:
    docker:
      - image: cimg/python:3.11
    resource_class: small

jobs:
  test:
    executor: py
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "pyproject.toml" }}
      - run:
          name: Install (dev extra)
          # uv is only a build tool for test_wheel_runtime_catalog (it shells out to
          # `uv build`); installing the project itself still uses pip.
          command: pip install uv && pip install -e ".[dev]"
      - save_cache:
          key: pip-v1-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Pytest (no network, no real LLM)
          # KNOWN-RED on main when this gate was added (2026-11-02): these four
          # fail on the current code, with or without the newest dojo. They are
          # deselected by exact node id so the gate catches NEW regressions
          # instead of blocking every PR. Fix them, then delete this list.
          command: >-
            python -m pytest src/tests -q --junitxml=test-results/junit.xml
            --deselect "src/tests/test_corporate_flat9_candidates.py::test_actual_rendered_request_stays_flat9[corporate_records_specialist_flat9_charter_v0]"
            --deselect "src/tests/test_corporate_flat9_candidates.py::test_actual_rendered_request_stays_flat9[corporate_records_specialist_flat9_poa_v0]"
            --deselect "src/tests/test_prompt_mutation_lineage.py::test_extraction_doctrine_lists_exactly_the_current_schema_fields"
            --deselect "src/tests/test_reconsideration.py::test_ground_truth_without_schema_fields_never_gates_coverage"
          no_output_timeout: 20m
      - run:
          name: Hermetic experiment regression gate (mock)
          command: >-
            PYTHONPATH=src python src/scripts/run_experiment.py
            --dataset mailroom-fixtures --mock
            --baseline docs/superpowers/baselines/experiment-baseline.json
      - store_test_results:
          path: test-results

workflows:
  ci:
    jobs:
      - test
