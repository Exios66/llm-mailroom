version: 2.1

# CircleCI is the CI hub. One small executor; tiered PR runs (docs, tests,
# affected, full: see src/scripts/ci_tests.py, which prints the tier and the
# reason first) and one weekly full/coverage backstop conserve free-tier
# credits. Keep ci/circleci: test as the required check. A scoped green cache
# can never stand in for full. Coverage (branch + per-test contexts) is the
# slowest part of a full run, so only the weekly backstop collects it.
parameters:
  full_suite:
    type: boolean
    default: false

executors:
  py:
    docker:
      - image: cimg/python:3.11
    resource_class: small

jobs:
  test:
    parameters:
      force_full:
        type: boolean
        default: false
      coverage:
        type: boolean
        default: false
    executor: py
    steps:
      - checkout
      - restore_cache:
          keys:
            - ci-baseline-v1-{{ .Branch }}-
      - run:
          name: Plan the test tier (docs, tests, affected or full)
          command: |
            mkdir -p test-results
            # Fetch failure is deliberately not fatal here: an unavailable
            # comparison ref makes the planner choose the full suite.
            git fetch origin main || true
            if [ "$CIRCLE_BRANCH" = main ]; then
              # Compare every commit since the last successful validation,
              # not just HEAD^ (multi-commit pushes and failed builds matter).
              base=$(cat test-results/baseline/revision 2>/dev/null || true)
              if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then
                base=__unavailable_successful_baseline__
              fi
            else
              base=origin/main
            fi
            full_arg=""
            if [ "<< parameters.force_full >>" = true ]; then
              full_arg="--full"
            fi
            cov_arg=""
            if [ "<< parameters.coverage >>" = true ]; then
              cov_arg="--coverage"
            fi
            printf 'export MAILROOM_TEST_BASE=%q\n' "$base" >> "$BASH_ENV"
            printf 'export MAILROOM_TEST_FULL_ARG=%q\n' "$full_arg" >> "$BASH_ENV"
            printf 'export MAILROOM_TEST_COV_ARG=%q\n' "$cov_arg" >> "$BASH_ENV"
            PYTHONPATH=src python src/scripts/ci_tests.py --base "$base" --branch "$CIRCLE_BRANCH" $full_arg $cov_arg
            git rev-parse 'HEAD^{tree}' > test-results/tree
      - restore_cache:
          keys:
            - ci-green-v2-{{ checksum "test-results/tree" }}-{{ checksum "test-results/plan-key" }}
      - run:
          name: Reuse only a pass for this exact tree and test scope
          command: |
            # Forced/weekly runs must execute even when this tree passed
            # earlier; dependencies and execution environments can drift.
            if [ "<< parameters.force_full >>" != true ] && [ -f test-results/green/ok ]; then
              circleci-agent step halt
            fi
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "pyproject.toml" }}
      - run:
          name: Install dev dependencies
          # pip honors the pinned Dojo dependency; uv workspace sources do not.
          command: pip install -e ".[dev]"
      - run:
          name: Install nested pipeline-diagnostics package
          # After the parent install: the tool imports pipeline modules, and the
          # editable install is what puts its console entry point on PATH.
          command: |
            if [ -f tools/pipeline-diagnostics/pyproject.toml ]; then
              pip install -e tools/pipeline-diagnostics
            fi
      - save_cache:
          key: pip-v1-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Execute the test cascade and relevant experiment gate
          command: |
            # Re-plan instead of trusting a saved plan that could be stale.
            PYTHONPATH=src python src/scripts/ci_tests.py --base "$MAILROOM_TEST_BASE" --branch "$CIRCLE_BRANCH" $MAILROOM_TEST_FULL_ARG $MAILROOM_TEST_COV_ARG --run
          no_output_timeout: 20m
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-evidence
      - run:
          name: Mark this tree and test scope green
          command: mkdir -p test-results/green && cp test-results/plan-key test-results/green/ok
      - run:
          name: Record successful validation baseline
          command: mkdir -p test-results/baseline && git rev-parse HEAD > test-results/baseline/revision
      - save_cache:
          key: ci-baseline-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - test-results/baseline
      - save_cache:
          key: ci-green-v2-{{ checksum "test-results/tree" }}-{{ checksum "test-results/plan-key" }}
          paths:
            - test-results/green

workflows:
  ci:
    jobs:
      - test:
          force_full: << pipeline.parameters.full_suite >>
          filters:
            branches:
              ignore: gh-pages
            tags:
              ignore: /.*/
  weekly-backstop:
    triggers:
      - schedule:
          cron: "17 8 * * 0"
          filters:
            branches:
              only: main
    jobs:
      - test:
          force_full: true
          coverage: true
