version: 2.1

# CircleCI is the CI hub. Tiered PR runs (docs, tests, affected, full: see
# src/scripts/ci_tests.py, which prints the tier and the reason first) and one
# weekly full/coverage backstop conserve free-tier credits. PR runs use a
# `large` executor (4 vCPU, 4x the per-minute rate of `small`) with four
# pytest-xdist workers: the full suite measured ~3.3x faster locally (313 s
# serial, 94 s on 4 workers), so a full-tier run costs somewhat more credits
# than on `small` in exchange for much shorter wall time (CircleCI credits not
# yet measured). The weekly coverage run stays on `small`, serial, and always
# builds a fresh virtualenv. PR runs reuse a virtualenv cached on the
# interpreter and both pyproject files (the root one carries the Dojo pin), so
# an unchanged dependency set skips pip. Keep ci/circleci: test as the required check. A scoped green cache
# can never stand in for full. Coverage (branch + per-test contexts) is the
# slowest part of a full run, so only the weekly backstop collects it.
parameters:
  full_suite:
    type: boolean
    default: false

executors:
  py:
    parameters:
      size:
        type: enum
        enum: [small, medium, large]
        default: small
    docker:
      - image: cimg/python:3.11
    resource_class: << parameters.size >>

jobs:
  no-session-links:
    # Rejects claude.ai links, Claude-Session trailers and "Generated with
    # Claude Code" footers in commit messages and the PR description.
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: No session links or Claude Code footers
          command: bash .circleci/check_no_session_links.sh

  test:
    parameters:
      force_full:
        type: boolean
        default: false
      coverage:
        type: boolean
        default: false
      size:
        type: enum
        enum: [small, medium, large]
        default: large
      workers:
        # pytest-xdist workers; match the executor's vCPUs (small 1, medium 2,
        # large 4); `-n auto` would read the host's CPU count, not the container's.
        type: integer
        default: 4
      fresh_venv:
        # Skip the virtualenv cache so unpinned transitive dependencies are
        # re-resolved (the weekly backstop must still catch upstream drift).
        type: boolean
        default: false
    executor:
      name: py
      size: << parameters.size >>
    environment:
      MAILROOM_TEST_WORKERS: << parameters.workers >>
    steps:
      - checkout
      - restore_cache:
          keys:
            - ci-baseline-v1-{{ .Branch }}-
      - run:
          name: Plan the test tier (docs, tests, affected or full)
          command: |
            mkdir -p test-results
            # Fetch failure is deliberately not fatal here: an unavailable
            # comparison ref makes the planner choose the full suite.
            git fetch origin main || true
            if [ "$CIRCLE_BRANCH" = main ]; then
              # Compare every commit since the last successful validation,
              # not just HEAD^ (multi-commit pushes and failed builds matter).
              base=$(cat test-results/baseline/revision 2>/dev/null || true)
              if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then
                base=__unavailable_successful_baseline__
              fi
            else
              base=origin/main
            fi
            full_arg=""
            if [ "<< parameters.force_full >>" = true ]; then
              full_arg="--full"
            fi
            cov_arg=""
            if [ "<< parameters.coverage >>" = true ]; then
              cov_arg="--coverage"
            fi
            printf 'export MAILROOM_TEST_BASE=%q\n' "$base" >> "$BASH_ENV"
            printf 'export MAILROOM_TEST_FULL_ARG=%q\n' "$full_arg" >> "$BASH_ENV"
            printf 'export MAILROOM_TEST_COV_ARG=%q\n' "$cov_arg" >> "$BASH_ENV"
            PYTHONPATH=src python src/scripts/ci_tests.py --base "$base" --branch "$CIRCLE_BRANCH" $full_arg $cov_arg
            git rev-parse 'HEAD^{tree}' > test-results/tree
      - restore_cache:
          keys:
            - ci-green-v2-{{ checksum "test-results/tree" }}-{{ checksum "test-results/plan-key" }}
      - run:
          name: Reuse only a pass for this exact tree and test scope
          command: |
            # Forced/weekly runs must execute even when this tree passed
            # earlier; dependencies and execution environments can drift.
            if [ "<< parameters.force_full >>" != true ] && [ -f test-results/green/ok ]; then
              circleci-agent step halt
            fi
      - run:
          name: Key the virtualenv on the interpreter
          # A venv points at its base interpreter: an image update to a new
          # 3.11.x must not restore a venv built against the old one.
          command: |
            python -c 'import sys; print(sys.version); print(sys.base_prefix)' > /tmp/venv-interpreter
            echo 'export PATH="$HOME/venv/bin:$PATH"' >> "$BASH_ENV"
      - unless:
          condition: << parameters.fresh_venv >>
          steps:
            - restore_cache:
                keys:
                  # Exact match only: pyproject.toml carries every pin, the Dojo git
                  # ref included, so any dependency change rebuilds from scratch.
                  - venv-v1-{{ checksum "/tmp/venv-interpreter" }}-{{ checksum "pyproject.toml" }}-{{ checksum "tools/pipeline-diagnostics/pyproject.toml" }}
      - run:
          name: Install dev dependencies (skipped on a virtualenv cache hit)
          # pip honors the pinned Dojo dependency; uv workspace sources do not.
          # The nested pipeline-diagnostics package installs after the parent:
          # the tool imports pipeline modules, and the editable install is what
          # puts its console entry point on PATH. Editable installs point at
          # this checkout's fixed path, so a restored venv sees the new tree.
          command: |
            if [ -x ~/venv/bin/python ] && ~/venv/bin/python -c 'import llm_dojo_scoring, xdist, mailroom_diagnostics' 2>/dev/null; then
              echo "virtualenv restored from cache"
              exit 0
            fi
            rm -rf ~/venv
            python -m venv ~/venv
            ~/venv/bin/pip install -e ".[dev]"
            if [ -f tools/pipeline-diagnostics/pyproject.toml ]; then
              ~/venv/bin/pip install -e tools/pipeline-diagnostics
            fi
      - save_cache:
          key: venv-v1-{{ checksum "/tmp/venv-interpreter" }}-{{ checksum "pyproject.toml" }}-{{ checksum "tools/pipeline-diagnostics/pyproject.toml" }}
          paths:
            - ~/venv
      - run:
          name: Execute the test cascade and relevant experiment gate
          command: |
            # Re-plan instead of trusting a saved plan that could be stale.
            PYTHONPATH=src python src/scripts/ci_tests.py --base "$MAILROOM_TEST_BASE" --branch "$CIRCLE_BRANCH" $MAILROOM_TEST_FULL_ARG $MAILROOM_TEST_COV_ARG --run
          no_output_timeout: 20m
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-evidence
      - run:
          name: Mark this tree and test scope green
          command: mkdir -p test-results/green && cp test-results/plan-key test-results/green/ok
      - run:
          name: Record successful validation baseline
          command: mkdir -p test-results/baseline && git rev-parse HEAD > test-results/baseline/revision
      - save_cache:
          key: ci-baseline-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - test-results/baseline
      - save_cache:
          key: ci-green-v2-{{ checksum "test-results/tree" }}-{{ checksum "test-results/plan-key" }}
          paths:
            - test-results/green

workflows:
  ci:
    jobs:
      - no-session-links
      - test:
          force_full: << pipeline.parameters.full_suite >>
          filters:
            branches:
              ignore: gh-pages
            tags:
              ignore: /.*/
  weekly-backstop:
    triggers:
      - schedule:
          cron: "17 8 * * 0"
          filters:
            branches:
              only: main
    jobs:
      - test:
          force_full: true
          coverage: true
          # Serial on the cheapest executor, exactly as before this change.
          size: small
          workers: 1
          fresh_venv: true
