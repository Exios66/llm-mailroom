version: 2.1

# Free-tier CircleCI gate for the pipeline repo (same service as
# local-mailroom-sandbox and llm-dojo-scoring). Runs on every push/PR once the
# repo is followed in CircleCI; to BLOCK merges, mark "ci/circleci: test" as a
# required check in the GitHub branch protection rule for main.
#
# Network-free and key-free by design: conftest.py mocks the LLM client, and the
# experiment gate runs with --mock.
#
# Usage burn: the job keys a "green" marker on the git TREE hash (file
# contents, not commit SHA). A merge whose tree equals the PR head that already
# passed (branch up to date with main), a re-push, or a branch carrying
# identical files restores the marker and halts as a success in seconds,
# before any install. The same code is never tested twice.
#
# Install with pip (NOT uv): pyproject [tool.uv.sources] points llm-dojo-scoring
# at a hub workspace that does not exist in this standalone repo.

executors:
  py:
    docker:
      - image: cimg/python:3.11
    resource_class: small

jobs:
  test:
    executor: py
    steps:
      - checkout
      - run:
          name: Identify the code under test (git tree hash)
          command: git rev-parse 'HEAD^{tree}' | tee .ci-tree
      - restore_cache:
          keys:
            - ci-green-v1-{{ checksum ".ci-tree" }}
      - run:
          name: Skip if this exact tree already passed
          command: |
            if [ -f .ci-green/ok ]; then
              echo "Tree $(cat .ci-tree) already passed CI; not re-running."
              circleci-agent step halt
            fi
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "pyproject.toml" }}
      - run:
          name: Install (dev extra)
          # uv is only a build tool for test_wheel_runtime_catalog (it shells out to
          # `uv build`); installing the project itself still uses pip.
          command: pip install uv && pip install -e ".[dev]"
      - save_cache:
          key: pip-v1-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          # test_wheel_runtime_catalog runs `uv build --offline`, which can only read
          # setuptools/wheel from uv's cache. Build once online so the cache has them.
          name: Warm uv build cache (for the offline wheel test)
          command: uv build --no-sources --wheel --out-dir /tmp/uv-warm .
      - run:
          name: Prepare test results dir
          command: mkdir -p test-results
      - run:
          name: Pytest (no network, no real LLM)
          command: python -m pytest src/tests -q -p no:cacheprovider --junitxml=test-results/junit.xml
          no_output_timeout: 20m
      - run:
          name: Hermetic experiment regression gate (mock)
          command: >-
            PYTHONPATH=src python src/scripts/run_experiment.py
            --dataset mailroom-fixtures --mock
            --baseline docs/superpowers/baselines/experiment-baseline.json
      - store_test_results:
          path: test-results
      - run:
          # Only reached when every step above passed.
          name: Mark this tree green
          command: mkdir -p .ci-green && cp .ci-tree .ci-green/ok
      - save_cache:
          key: ci-green-v1-{{ checksum ".ci-tree" }}
          paths:
            - .ci-green

workflows:
  ci:
    jobs:
      - test:
          filters:
            branches:
              ignore:
                - gh-pages
            tags:
              ignore: /.*/
