version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mailroom-postgres
    environment:
      POSTGRES_USER: mailroom
      POSTGRES_PASSWORD: mailroom
      POSTGRES_DB: mailroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailroom"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: mailroom-clickhouse
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user langfuse --password langfuse --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: mailroom-langfuse
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mailroom:mailroom@postgres:5432/mailroom
      NEXTAUTH_SECRET: change-me-to-a-random-secret-in-production
      NEXTAUTH_URL: http://localhost:3000
      SALT: change-me-to-a-random-salt-in-production
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DB: langfuse
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/auth/signin || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Local LLM (Phase 10 — not used until cutover) ===
  ollama:
    image: ollama/ollama:latest
    container_name: mailroom-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - local-llm

volumes:
  pgdata:
  clickhouse_data:
  ollama_data:
