[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom-diagnostics"
version = "0.1.0"
description = "Native read-only diagnostics for the llm-mailroom pipeline graph and display contract"
requires-python = ">=3.11"
dependencies = [
    # The parent owns graph/taxonomy and must be installed from this checkout.
    # Do not resolve the unrelated PyPI project named mailroom. Install first:
    #   .venv/bin/pip install -e .
    "pydantic>=2.0",
    "structlog>=24.0",
    # Optional HTTP app: the CLI and offline artifact reads do not need these
    # at runtime, but the packaged wheel must declare what the app imports.
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
mailroom-diagnostics = "mailroom_diagnostics.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["mailroom_diagnostics*"]

[tool.setuptools.package-data]
# Generated React assets land here in D1.1. The rule is explicit so a built
# wheel carries them; the source tree remains usable without an index.html.
mailroom_diagnostics = ["static/*", "static/**/*"]
