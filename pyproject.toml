[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom"
version = "0.7.1"
description = "Multi-Agent Legal Document Processing Pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3",
    "pydantic>=2.0",
    "watchdog>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "openai>=1.30",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "python-docx>=1.0",
    "reportlab>=4.0",
    "pyyaml>=6.0",
    "langfuse>=2.50",
    "braintrust>=0.31",
    "structlog>=24.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jellyfish>=1.0",
    "python-dateutil>=2.8",
    "arize-phoenix>=4.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@v0.16.0",
]
