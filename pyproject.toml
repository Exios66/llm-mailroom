[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom"
version = "0.2.2"
description = "Multi-Agent Legal Document Processing Pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3",
    "pydantic>=2.0",
    "watchdog>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "psycopg[binary]>=3.1",
    "openai>=1.30",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",  # vision ingestion: render PDF pages to images for vision-capable models
    "python-docx>=1.0",
    "reportlab>=4.0",
    "pyyaml>=6.0",
    "langfuse>=2.50",
    "braintrust>=0.31",
    "structlog>=24.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "jellyfish>=1.0",
    "python-dateutil>=2.8",
    "scipy>=1.10",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*", "langchain_agents*", "graph*", "llm*", "schemas*", "pipeline*", "storage*", "api*", "observability*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src", "."]
