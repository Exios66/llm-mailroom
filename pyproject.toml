[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom"
version = "0.9.3"
description = "Multi-Agent Legal Document Processing Pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3",
    "pydantic>=2.0",
    "watchdog>=4.0",
    "fastapi>=0.110",
    # FastAPI form and upload routes (src/api/main.py) need it. It used to arrive
    # transitively through arize-phoenix, which c816130 removed.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "openai>=1.30",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",  # vision ingestion: render PDF pages to images for vision-capable models
    "python-docx>=1.0",
    "reportlab>=4.0",
    "pyyaml>=6.0",
    "langfuse>=4.9,<5",
    "braintrust>=0.31",
    "structlog>=24.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jellyfish>=1.0",
    "python-dateutil>=2.8",
    "markdown-it-py>=3.0,<5",  # deterministic intake Markdown-to-text parsing
    # Local, cost-free OpenTelemetry tracing (default fallback in
    # `observability/tracing.py`; aligned with llm-entity-extraction).
    # OpenInference instruments the OpenAI SDK for the Phoenix backend; the
    # full `arize-phoenix` server package is intentionally NOT a dependency
    # (it pulls arize-phoenix-otel, which has no wheels for Python >=3.15).
    "openinference-instrumentation-openai>=0.1",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    # Parquet warehouse export (storage/warehouse.py); optional at runtime
    # (auto-disabled when absent) but kept as a core dep for parity with the
    # previous arize-phoenix transitive pull.
    "pyarrow>=15.0",
    # Unified scoring engine (KANBAN-061): llm_dojo_scoring.field_scoring is
    # the canonical engine since v0.5.0.
    # Interim pin f95c318 (llm-dojo-scoring#135, unreleased): date scoring hardening —
    # year-verified dates, strict list date matching; no version cut yet.
    # v0.28.1 release (00a2a7f, llm-dojo-scoring#130/#131): the sorter guide files a bylaw
    # amendment under bylaws, never board_resolution (agrees with sorter_condensed_v5).
    # v0.28.0 (cab9768, #124): v10 alignment — Contract/Merger v2 field maps, gt_from_v10_row.
    "llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@f95c3188a1a634a9a2354afd5351edd8dd152a89",
]

[project.optional-dependencies]
# Heavy embedding & numerical deps pulled OUT of the core install. They are
# only used by the optional embedding cosine second signal and the scipy
# Hungarian matcher in observability/field_scoring.py — both degrade
# gracefully (pure string scoring / greedy match) when not installed. Install
# with:  pip install -e ".[embeddings]"
embeddings = [
    "scipy>=1.10",
    "sentence-transformers>=3.0",
]
# Postgres storage engine (SQLite is the default; the checkpointer always
# falls back to MemorySaver). Install with:  pip install -e ".[postgres]"
postgres = [
    "psycopg[binary]>=3.1",
]
# Modal-deployed vLLM serving (KANBAN-064, deploy/modal_vllm.py). Deploy-time
# only — the runtime pipeline never imports modal. Install with:
#   pip install -e ".[deploy]"
deploy = [
    "modal==1.6.2",
]
# BERT intake fast-path runtime (agents/bert_intake.py + the sibling
# mailroom-ml package, #85 M6a): ONNX int8 inference ONLY — deliberately no
# torch/transformers anywhere (verified onnxruntime 1.30.0 cp311 wheels for
# linux amd64 + aarch64 manylinux_2_28). transformers/torch/optimum belong
# exclusively to the future build-time ONNX export tooling (deploy/README.md
# § Offline model packaging) and are never runtime/extra deps here.
# Install with:  pip install -e ".[bert]"
bert = [
    "onnxruntime>=1.30",
    "tokenizers>=0.20",
    "huggingface-hub>=0.30",
]
# Interactive notebooks (notebooks/dataset_browser.ipynb). The browser module
# degrades to plain-text output without these — nothing in the pipeline or
# test suite needs them. Install with:  pip install -e ".[notebooks]"
notebooks = [
    "ipywidgets>=8.1",
    "jupyterlab>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # src/tests/test_notebook_suite.py re-executes notebooks/ headlessly.
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    # src/tests/test_wheel_runtime_catalog.py builds the wheel offline with these
    # (no build isolation), matching [build-system].requires.
    "setuptools>=68.0",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*", "audit*", "dojo_source*", "langchain_agents*", "graph*", "llm*", "schemas*", "pipeline*", "storage*", "api*", "observability*", "config"]
namespaces = true

[tool.setuptools.package-data]
"llm.frozen_v1" = ["lineage.json", "README.md"]
"config" = ["taxonomy.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "no_langchain_mock: skip conftest's LangChain provider mock (hub#42 provider-seam tests)",
    "live_corpus: fetches pinned real documents from the Hub; set MAILROOM_LIVE_TESTS=1",
]
testpaths = ["src/tests", "tools/pipeline-diagnostics/tests"]
pythonpath = ["src", ".", "tools/pipeline-diagnostics/backend"]

# Monorepo dev: resolve the shared scoring engine from the workspace instead
# of the release git pin above. Plain `pip install .` keeps using the pin.
# (uv hard-requires workspace members to use `{ workspace = true }` here.)
[tool.uv.sources]
llm-dojo-scoring = { workspace = true }

[tool.coverage.run]
omit = ["src/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
