<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">The LLM-Mailroom</title><desc id="desc">Intake prepares documents, the sorter classifies them, and a class specialist extracts structured facts. Quality checks may invoke Judge, Arbiter or human review; matter conflicts reach Boss. Procedural compilation and archival produce an audit trail.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient><linearGradient id="heading"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
<style>.cue{stroke-dasharray:6 22;animation:travel 4.5s linear 1}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.cue{animation:none}}</style>
<rect width="1200" height="480" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="479" rx="24" fill="none" stroke="#334155"/>
<text x="600" y="54" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">THE MAILROOM CONSTELLATION</text>
<text x="600" y="132" font-size="64" fill="url(#heading)" font-weight="800" text-anchor="middle">The LLM-Mailroom</text>
<text x="600" y="181" font-size="23" fill="#cbd5e1" font-weight="400" text-anchor="middle">Legal documents, structured facts, and a receipt for every decision.</text>
<text x="600" y="220" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="middle">LANGGRAPH · FIVE DOCUMENT CLASSES · FASTAPI</text>
<rect x="48" y="260" width="258" height="86" rx="14" fill="#111a2e" stroke="#38bdf8" stroke-opacity=".65"/><rect x="64" y="278" width="5" height="50" rx="2" fill="#38bdf8"/><text x="82" y="296" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Intake + prepare</text><text x="82" y="323" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">files → manifest</text>
<path d="M306 303 L327 303" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path class="cue" d="M306 303 L327 303" fill="none" stroke="#7dd3fc" stroke-width="2"/>
<rect x="330" y="260" width="258" height="86" rx="14" fill="#111a2e" stroke="#c084fc" stroke-opacity=".65"/><rect x="346" y="278" width="5" height="50" rx="2" fill="#c084fc"/><text x="364" y="296" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Classify</text><text x="364" y="323" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">sorter + confidence</text>
<path d="M588 303 L609 303" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path class="cue" d="M588 303 L609 303" fill="none" stroke="#7dd3fc" stroke-width="2"/>
<rect x="612" y="260" width="258" height="86" rx="14" fill="#111a2e" stroke="#f472b6" stroke-opacity=".65"/><rect x="628" y="278" width="5" height="50" rx="2" fill="#f472b6"/><text x="646" y="296" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Extract + gate</text><text x="646" y="323" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">class specialist</text>
<path d="M870 303 L891 303" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path class="cue" d="M870 303 L891 303" fill="none" stroke="#7dd3fc" stroke-width="2"/>
<rect x="894" y="260" width="258" height="86" rx="14" fill="#111a2e" stroke="#22c55e" stroke-opacity=".65"/><rect x="910" y="278" width="5" height="50" rx="2" fill="#22c55e"/><text x="928" y="296" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Compile + archive</text><text x="928" y="323" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">record + audit receipt</text>
<path d="M741 346 V404 H1020 V346" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="600" y="391" font-size="18" fill="#facc15" font-weight="600" text-anchor="middle">When required: Judge → Arbiter → human review</text>
<text x="600" y="435" font-size="17" fill="#cbd5e1" font-weight="400" text-anchor="middle">Boss handles matter conflicts · procedural compilation · hash-chained audit</text>
</svg>
