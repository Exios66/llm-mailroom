<text x="600" y="44" font-size="13" fill="#8b9bb4" font-weight="700" text-anchor="middle" letter-spacing="3">THE MAILROOM CONSTELLATION · THE PIPELINE</text><ellipse cx="600" cy="116" rx="420" ry="70" fill="url(#glow)" opacity=".18"/><text x="600" y="126" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#ttl)"><tspan font-weight="300" font-style="italic">The </tspan>LLM-Mailroom</text><text x="600" y="170" font-size="20" fill="#cbd5e1" text-anchor="middle">Ingest, classify, extract, verify — and archive every legal document with a hash-chained receipt.</text><text x="600" y="202" font-size="13" fill="#8b9bb4" font-weight="600" text-anchor="middle" letter-spacing="3">13 GRAPH NODES · 5 DOCUMENT CLASSES · SQLITE-FIRST · FASTAPI + WATCHER</text><line x1="40" y1="292" x2="1160" y2="292" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
