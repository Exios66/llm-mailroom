<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55e39a"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd45a"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d39cff"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6262"/></marker><marker id="w" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d7e2e8"/></marker></defs><rect width="1600" height="1000" fill="#070b0d"/><rect x="28" y="24" width="1544" height="952" rx="18" fill="#0a1013" stroke="#26353c"/><g font-family="Arial,sans-serif"><text x="800" y="68" text-anchor="middle" font-size="34" font-weight="700" fill="#f4f8fb">LLM MAILROOM PIPELINE</text><text x="800" y="94" text-anchor="middle" font-size="16" fill="#91a5b1">13-node LangGraph state machine · six operator-visible phases · confidence, adjudication &amp; human governance</text>
<!-- Main automated lane --><g><rect x="90" y="135" width="520" height="100" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="185" r="22" fill="#55e39a"/><text x="124" y="192" text-anchor="middle" font-size="18" font-weight="700">1</text><text x="162" y="170" font-size="20" font-weight="700" fill="#55e39a">INGEST DOCUMENT</text><text x="162" y="194" font-size="14" fill="#c6d2d9">Claim → normalize → manifest → text / vision inputs</text><text x="162" y="216" font-size="12" font-weight="600" fill="#7fae9b">Watcher / API · deterministic intake</text><rect x="90" y="280" width="520" height="110" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="335" r="22" fill="#55e39a"/><text x="124" y="342" text-anchor="middle" font-size="18" font-weight="700">2</text><text x="162" y="317" font-size="20" font-weight="700" fill="#55e39a">CLASSIFY</text><text x="162" y="341" font-size="14" fill="#c6d2d9">SorterAgent → live class + confidence</text><text x="162" y="364" font-size="12" font-weight="600" fill="#7fae9b">High → Extract · Medium → Retry · Low / unknown → Review</text><rect x="90" y="445" width="520" height="120" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="505" r="22" fill="#55e39a"/><text x="124" y="512" text-anchor="middle" font-size="18" font-weight="700">3</text><text x="162" y="483" font-size="20" font-weight="700" fill="#55e39a">EXTRACT FIELDS</text><text x="162" y="508" font-size="14" fill="#c6d2d9">Class specialist → structured Pydantic output</text><text x="162" y="532" font-size="12" font-weight="600" fill="#7fae9b">Schema + confidence + factuality + completeness gates</text><rect x="90" y="620" width="520" height="100" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="670" r="22" fill="#55e39a"/><text x="124" y="677" text-anchor="middle" font-size="18" font-weight="700">4</text><text x="162" y="655" font-size="20" font-weight="700" fill="#55e39a">COMPILE REPORT</text><text x="162" y="679" font-size="14" fill="#c6d2d9">Deterministically assemble matter record</text><text x="162" y="701" font-size="12" font-weight="600" fill="#7fae9b">No reporter LLM call · evidence + confidence retained</text><rect x="90" y="765" width="520" height="90" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="810" r="22" fill="#55e39a"/><text x="124" y="817" text-anchor="middle" font-size="18" font-weight="700">5</text><text x="162" y="799" font-size="20" font-weight="700" fill="#55e39a">CATALOG</text><text x="162" y="823" font-size="14" fill="#c6d2d9">Persist documents + matters to SQLite / Postgres</text><rect x="90" y="895" width="520" height="60" rx="14" fill="#0d171b" stroke="#5fa8ff" stroke-width="2"/><circle cx="124" cy="925" r="18" fill="#5fa8ff"/><text x="124" y="931" text-anchor="middle" font-size="14" font-weight="700">6</text><text x="162" y="931" font-size="20" font-weight="700" fill="#5fa8ff">ARCHIVE</text><text x="280" y="931" font-size="14" fill="#c6d2d9">file + manifest + hash-chained audit · COMPLETE</text><path d="M350 235V280M350 390V445M350 565V620M350 720V765M350 855V895" stroke="#55e39a" stroke-width="3" fill="none" marker-end="url(#a)"/></g>
<!-- Human review --> <rect x="720" y="145" width="390" height="125" rx="14" fill="#0d171b" stroke="#ffd45a" stroke-width="2"/><text x="744" y="179" font-size="20" font-weight="700" fill="#ffd45a">HUMAN REVIEW · LANE A</text><text x="744" y="206" font-size="14" fill="#c6d2d9">Governance boundary for ambiguous intake</text><text x="744" y="229" font-size="14" fill="#c6d2d9">Approve · Correct class · Reject</text><text x="744" y="251" font-size="12" font-weight="600" fill="#d6b95b">Resolution is attributable and audited</text><path d="M610 335H665V207H720" stroke="#ffd45a" stroke-width="3" fill="none" marker-end="url(#y)"/><text x="622" y="322" font-size="12" font-weight="600" fill="#ffd45a">LOW / UNKNOWN</text><path d="M915 270V315H520V280" stroke="#ffd45a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#y)"/><text x="705" y="303" font-size="12" font-weight="600" fill="#ffd45a">CORRECT CLASS / REQUEUE</text>
<!-- Judge / Arbiter --><rect x="720" y="350" width="390" height="110" rx="14" fill="#0d171b" stroke="#d39cff" stroke-width="2"/><text x="744" y="384" font-size="20" font-weight="700" fill="#d39cff">JUDGE VERIFY</text><text x="744" y="410" font-size="14" fill="#c6d2d9">Completeness review for ambiguous extraction</text><text x="744" y="434" font-size="12" font-weight="600" fill="#ad83c9">Stand · Re-extract · Human Review</text><rect x="720" y="515" width="390" height="110" rx="14" fill="#0d171b" stroke="#d39cff" stroke-width="2"/><text x="744" y="549" font-size="20" font-weight="700" fill="#d39cff">ARBITER</text><text x="744" y="575" font-size="14" fill="#c6d2d9">Adjudicate unresolved agent disagreement</text><text x="744" y="599" font-size="12" font-weight="600" fill="#ad83c9">Stand · Retry Extraction · Human Review</text><path d="M610 505H670V405H720M915 460V515" stroke="#d39cff" stroke-width="3" fill="none" marker-end="url(#p)"/><text x="625" y="493" font-size="12" font-weight="600" fill="#d39cff">AMBIGUOUS / LOW FIELD CONFIDENCE</text><path d="M720 570H650V680H610M915 625V675H540V445" stroke="#d39cff" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#p)"/><text x="615" y="665" font-size="12" font-weight="600" fill="#d39cff">STAND / ACCEPT</text><text x="750" y="662" font-size="12" font-weight="600" fill="#d39cff">RETRY EXTRACTION</text><path d="M1110 570H1160V650" stroke="#ffd45a" stroke-width="3" fill="none" marker-end="url(#y)"/><rect x="1110" y="650" width="280" height="105" rx="14" fill="#0d171b" stroke="#ffd45a" stroke-width="2"/><text x="1130" y="682" font-size="20" font-weight="700" fill="#ffd45a">HUMAN REVIEW · LANE B</text><text x="1130" y="709" font-size="14" fill="#c6d2d9">Final extraction decision</text><text x="1130" y="733" font-size="12" font-weight="600" fill="#d6b95b">Approve · Correct · Reject</text><path d="M1250 755H610V670" stroke="#ffd45a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#y)"/>
<!-- Boss conflict --><rect x="1160" y="350" width="300" height="120" rx="14" fill="#0d171b" stroke="#ff6262" stroke-width="2"/><text x="1182" y="384" font-size="20" font-weight="700" fill="#ff6262">BOSS ESCALATION</text><text x="1182" y="410" font-size="14" fill="#c6d2d9">Matter-level consistency conflict</text><text x="1182" y="434" font-size="14" fill="#c6d2d9">No silent recency / confidence choice</text><text x="1182" y="456" font-size="12" font-weight="600" fill="#d47a7a">Approve → Compile · Review → Human</text><path d="M610 515H1120V410H1160" stroke="#ff6262" stroke-width="3" fill="none" marker-end="url(#r)"/><text x="745" y="502" font-size="12" font-weight="600" fill="#ff6262">MATTER CONFLICT</text><path d="M1160 440H1080V670H610" stroke="#ff6262" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#r)"/><text x="975" y="655" font-size="12" font-weight="600" fill="#ff6262">RESOLVED STATE → COMPILE</text><rect x="1160" y="810" width="300" height="70" rx="14" fill="#0d171b" stroke="#ff6262" stroke-width="2"/><text x="1182" y="842" font-size="20" font-weight="700" fill="#ff6262">FAILED / TERMINAL</text><text x="1182" y="864" font-size="14" fill="#c6d2d9">Rejected or unrecoverable work</text><path d="M1110 707H1140V845H1160" stroke="#ff6262" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#r)"/>
<!-- legend / controls --><rect x="650" y="765" width="420" height="175" rx="14" fill="#0b1317" stroke="#26353c"/><text x="672" y="796" font-size="20" font-weight="700" fill="#f4f8fb">ROUTING DEFAULTS</text><text x="672" y="825" font-size="14" fill="#c6d2d9">Classification high: 0.97 · low: 0.88</text><text x="672" y="849" font-size="14" fill="#c6d2d9">Retry max: 2 · Judge max passes: 3</text><text x="672" y="873" font-size="14" fill="#c6d2d9">Field ambiguous band: 0.50–0.85</text><text x="672" y="901" font-size="12" font-weight="600" fill="#91a5b1">Class-specific overrides take precedence</text><text x="672" y="923" font-size="12" font-weight="600" fill="#55e39a">Source: src/config/taxonomy.yaml</text><rect x="650" y="135" width="420" height="150" rx="14" fill="#0b1317" stroke="#26353c"/><text x="670" y="162" font-size="20" font-weight="700" fill="#f4f8fb">ROUTING LEGEND</text><text x="670" y="190" font-size="14" fill="#c6d2d9">● Green  Primary automated flow</text><text x="670" y="216" font-size="14" fill="#c6d2d9">● Yellow  Human review / decision</text><text x="670" y="242" font-size="14" fill="#c6d2d9">● Purple  Judge / Arbiter</text><text x="875" y="190" font-size="14" fill="#c6d2d9">● Red  Conflict / escalation</text><text x="875" y="216" font-size="14" fill="#c6d2d9">- - Retry / reroute</text><text x="875" y="242" font-size="14" fill="#c6d2d9">→ Successful progression</text><text x="800" y="968" text-anchor="middle" font-size="12" font-weight="600" fill="#52636d">LLM MAILROOM · OPERATIONS / ARCHITECTURE REFERENCE · HUMAN DECISIONS ARE AUDITABLE</text></g></svg>