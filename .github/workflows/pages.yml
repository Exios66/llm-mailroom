name: Deploy landing page

# Publishes landing/ (plus the mascot assets from docs/assets/mascot/) to GitHub Pages.
# Repo settings: Pages -> Build and deployment -> Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "docs/assets/mascot/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -r landing/. _site/
          cp -r docs/assets/mascot _site/assets/mascot
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
