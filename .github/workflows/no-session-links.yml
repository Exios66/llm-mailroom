# Blocks private claude.ai session links from reaching the repository.
# A session link (https://claude.ai/code/session_...) opens a private agent
# session; it must never appear in a PR title, a PR description (which becomes
# the squash-merge message) or a commit on main.
name: No session links

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: PR title and description
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -Eiq 'claude\.ai/code/session'; then
            echo "::error::Remove the claude.ai session link from the PR title or description."
            exit 1
          fi
          echo "No session links in the PR title or description."
      - name: Commits pushed to main
        if: github.event_name == 'push'
        env:
          MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          if printf '%s\n' "$MESSAGES" | grep -Eiq 'claude\.ai/code/session'; then
            echo "::error::A commit pushed to main carries a claude.ai session link."
            exit 1
          fi
          echo "No session links in the pushed commits."
