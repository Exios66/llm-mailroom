# Keeps the unified audit row roadmap aligned and its tracking issue current.
#
# - pull_request: fails when the plans and the spec disagree, or the status table in
#   docs/superpowers/plans/unified-audit-row/README.md is stale
#   (fix with `python src/scripts/roadmap_status.py --write`).
# - push to main: same check, then rewrites the body of the tracking issue from the plans.
# - workflow_dispatch: re-sync by hand.

name: Roadmap sync

on:
  pull_request:
    paths:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/unified-audit-row/**"
      - "src/scripts/roadmap_status.py"
  push:
    branches: [main]
    paths:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/unified-audit-row/**"
      - "src/scripts/roadmap_status.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: roadmap-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the <!-- roadmap:issue ... --> marker in the roadmap README.
  ROADMAP_ISSUE: "150"

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check plans against spec
        run: python src/scripts/roadmap_status.py --check
      - name: Update tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q "roadmap:issue ${GITHUB_REPOSITORY}#${ROADMAP_ISSUE} " docs/superpowers/plans/unified-audit-row/README.md \
            || { echo "README issue marker does not name ${GITHUB_REPOSITORY}#${ROADMAP_ISSUE}"; exit 1; }
          python src/scripts/roadmap_status.py --issue-body > "$RUNNER_TEMP/roadmap-body.md"
          gh issue edit "$ROADMAP_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/roadmap-body.md"
