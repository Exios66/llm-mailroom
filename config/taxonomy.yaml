# Mailroom Document Taxonomy
# Adding a new doc class: add an entry below + a matching schema in schemas/documents.py
# Adjusting thresholds: edit the numbers below — no code changes needed.

pipeline:
  bins:
    inbox: "{base_dir}/pipeline/inbox"
    processing: "{base_dir}/pipeline/processing"
    classified: "{base_dir}/pipeline/classified"
    review: "{base_dir}/pipeline/review"
    failed: "{base_dir}/pipeline/failed"
    archive: "{base_dir}/archive"
    manifests: "{base_dir}/manifests"
  # Text-based PDFs whose extraction yields at least this many chars/page are
  # transcribed directly (no LLM reformat pass) — the LLM pass only runs for
  # scanned/garbled PDFs. See agents/pdf_transcriber.py:_looks_clean_text_pdf.
  pdf_direct_chars_per_page: 800

llm_retry:
  max_attempts: 3
  base_delay: 1.0
  max_delay: 30.0
  jitter: 0.3

run_limits:
  # Hard wall-clock cutoff per document run (abort past this).
  deadline_seconds: 3600
  # Per-LLM-call socket timeout — bounds a single hanging provider request.
  llm_call_timeout_seconds: 120
  # Per-run cumulative output-token cap — aborts stuck/excessively-verbose
  # models that keep generating past the point of usefulness.
  max_total_output_tokens: 20000

# Approximate per-1M-token pricing used for estimated_cost_usd scoring and
# synced to the Langfuse model registry via scripts/sync_models.py.
# Update from the OpenRouter model page; unknown models estimate cost as 0.
cost_models:
  qwen/qwen3.7-flash:
    input_per_million: 0.03
    output_per_million: 0.13
  deepseek/deepseek-v4-flash:
    input_per_million: 0.05
    output_per_million: 0.25
  deepseek/deepseek-v4-pro:
    input_per_million: 0.435
    output_per_million: 0.87

confidence:
  # high is the auto-continue gate for classification: confidence >= high → extract → archive.
  # Recalibrated to 0.95 from observed sorter behavior (pilot, Aug 2026): every unambiguously
  # classifiable document scored >= 0.95, while the deliberately multi-topic memo (ambiguous_01)
  # scored 0.90 — which must route to human review, not archive. The band [low, high) is
  # "classified but not clearly confident" → human review (see graph/routing.py:after_classify).
  high: 0.95
  low: 0.70        # below this → retry; still below after retry → human review
  retry_max: 1     # max retries before routing to review
  conflict_threshold: 0.3  # extraction confidence gap below this → potential conflict

# Deterministic field-type-aware extraction scoring (issues #4/#5). The scorer
# normalizes each field by its type (date/money/id exact-after-normalize, name
# fuzzy match, free-text token F1, entity-list bipartite matching) and, for
# ambiguous free-text/name fields, uses embedding cosine similarity
# (sentence-transformers) as a second signal. `ambiguous_band` is the judge
# escalation gate: fields scoring inside the band trigger the LLM judge; runs
# scoring clearly above or below the band skip the judge entirely (2 evaluator
# calls saved per run). See observability/field_scoring.py.
field_scoring:
  ambiguous_band: [0.5, 0.85]
  bipartite_match_threshold: 0.6  # minimum pairwise similarity for a list match
  embedding_enabled: true
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_rescue_below: 0.7  # only consult embeddings when string score is below this

doc_classes:
  - key: contract
    label: "Contract / Agreement"
    schema: ContractExtraction
    specialist: contracts_specialist
    description: "Formal agreements between parties: M&A, vendor, employment, NDAs, etc."
    field_types:
      parties: entity_list:name
      effective_date: date
      term_length: free_text
      termination_clauses: entity_list:free_text
      governing_law: name
      key_obligations: entity_list:free_text
      contract_value: money
      renewal_terms: free_text

  - key: corporate_record
    label: "Corporate Record"
    schema: CorporateRecordExtraction
    specialist: corporate_records_specialist
    description: "Bylaws, resolutions, board minutes, cap table entries, incorporation docs"
    field_types:
      entity_name: name
      record_type: name
      effective_date: date
      key_provisions: entity_list:free_text
      signatories: entity_list:name
      jurisdiction: name
      filing_number: id

  - key: due_diligence
    label: "Due Diligence"
    schema: DueDiligenceExtraction
    specialist: due_diligence_specialist
    description: "Checklists, disclosure schedules, diligence memos, risk assessments"
    field_types:
      target_entity: name
      diligence_type: name
      material_findings: entity_list:free_text
      risk_flags: entity_list:free_text
      outstanding_items: entity_list:free_text
      document_date: date
      prepared_by: name

  - key: correspondence
    label: "Correspondence"
    schema: CorrespondenceExtraction
    specialist: correspondence_specialist
    description: "Letters, emails, memos, notices between parties or with regulators"
    field_types:
      sender: name
      recipient: name
      additional_recipients: entity_list
      communication_type: name
      communication_date: date
      key_points: entity_list
      demand_amount: money
      action_items: entity_list
      urgency: name
      referenced_communications: entity_list

  - key: compliance_filing
    label: "Compliance Filing"
    schema: ComplianceFilingExtraction
    specialist: compliance_specialist
    description: "SEC filings, state registrations, regulatory submissions, annual reports"
    field_types:
      filing_type: name
      regulatory_body: name
      filing_date: date
      due_date: date
      entity_name: name
      key_requirements: entity_list:free_text
      status: name
      reference_number: id

  - key: court_opinion
    label: "Court Opinion"
    schema: CourtOpinionExtraction
    specialist: court_opinions_specialist
    description: "Judicial opinions and orders: published decisions, memorandum opinions, rulings by federal and state courts"
    field_types:
      case_name: name
      court: name
      date_decided: date
      docket_number: id
      opinion_type: name
      parties: entity_list:name
      holding: free_text
      legal_issues: entity_list:free_text
      outcome: free_text
      citations: entity_list:id
      authored_by: name

file_extensions:
  - .txt
  - .pdf
  - .docx
  - .md

# === Agent → model mapping ===
# Each agent list entry: provider, model, temperature, optional max_tokens
# (caps output/reasoning-token generation — see agents/base.py) and optional
# max_input_chars (input-text budget per call; defaults to 25000). Large
# documents need a bigger window or late-page fields (termination clauses,
# obligations) get truncated away — see PILOT_AUDIT_REPORT.md fix #5.
# To cut over locally: change provider to "ollama", model to e.g. "qwen3:7b"
# Setting DEFAULT_PROVIDER env var overrides the provider globally.
agents:
  sorter:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 2048
    max_input_chars: 12000

  contracts_specialist:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 100000

  corporate_records_specialist:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 40000

  due_diligence_specialist:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 40000
    reasoning_effort: none

  correspondence_specialist:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 40000

  compliance_specialist:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 60000

  court_opinions_specialist:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 60000

  reporter:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.2
    max_tokens: 3072
    # Reports are synthesis, not analysis; reserve the completion budget for
    # visible output instead of hidden reasoning tokens.
    reasoning_effort: none

  boss:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 8192
    # OpenRouter reasoning effort; "max" maps to ~95% of max_tokens as the
    # thinking budget for Qwen thinking models.
    reasoning_effort: max

  pdf_transcriber:
    provider: openrouter
    model: qwen/qwen3.7-flash
    temperature: 0.1
    max_tokens: 8192

  # Offline LLM-as-a-judge used by scripts/run_quality_judges.py.
  judge:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    temperature: 0.1
    max_tokens: 2048
    reasoning_effort: none
